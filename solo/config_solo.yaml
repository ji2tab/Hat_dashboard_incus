display:
  timezone: Asia/Tokyo

# 履歴・現在TGの保存先(ProtectSystem対策で /var/lib を推奨)
history_dir: /var/lib/mmdvm-dash/history

# DMR ID DB (RadioID user.csv)。24hごとに自動更新。
dmr_ids: /home/asai/mmdvm-dash/user.csv
dmr_ids_update:
  url: https://radioid.net/static/user.csv
  interval_hours: 24

# TG変更(TGIF API)。既定でよければ省略可。
# tgif_api: http://tgif.network:5040/api/sessions/update

# 手動の上書き(任意)。DBより優先。
callsigns: {}

# 監視対象ノード(ローカル mosquitto 直結)。
instances:
  jr2dhr:
    # label: "任意の表示名"   # 省略時は ini のコールサインを使用
    topic: "host/#"
    mqtt_host: 127.0.0.1
    mqtt_port: 1883
    mqtt_user: mmdvm
    mqtt_pass: mmdvm
    ini: /opt/MMDVMHost/MMDVM-Host.ini
